name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Tests use fakes only: no LLM, geocoder or Apify calls, so no secrets are needed.
      - name: Tests
        run: uv run pytest -q

      # Rules-only evaluation: free and deterministic. Fails if any rules case regresses.
      - name: Evaluation gate
        run: uv run python -m underwriting_agent.evals --gate
