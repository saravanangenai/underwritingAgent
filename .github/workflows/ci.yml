name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # this action publishes exact tags only, no floating v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Tests use fakes only: no LLM, geocoder or Apify calls, so no secrets are needed.
      - name: Tests
        run: uv run pytest -q

      # Rules-only evaluation: free and deterministic. Fails if any rules case regresses.
      - name: Evaluation gate
        run: uv run python -m underwriting_agent.evals --gate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tests mock the API, so no backend is needed.
      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
